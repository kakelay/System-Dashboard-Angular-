<nav class="navbar" [class.dark-mode]="isDarkMode">
  <div class="nav-left">
    <!-- Sidebar Toggle -->
    <button class="toggle-btn" (click)="toggleSidebar.emit()">
      <span class="material-icons">menu</span>
    </button>

    <!-- Search Box -->
    <div class="search-box">
      <span class="material-icons">search</span>
      <input type="text" placeholder="Search..." />
    </div>
  </div>

  <div class="nav-right" *ngIf="user$ | async as user">
    <!-- Language Selector -->
    <div class="language-selector">
      <select
        [(ngModel)]="currentLanguage"
        (change)="changeLanguage(currentLanguage)"
        class="language-select"
      >
        <option *ngFor="let lang of availableLanguages" [value]="lang">
          {{ getLanguageName(lang) }}
        </option>
      </select>
    </div>

    <!-- Notifications -->
    <div class="notifications">
      <span class="material-icons">notifications_none</span>
    </div>

    <!-- Dark / Light Mode Toggle -->
    <button class="theme-toggle-btn" (click)="toggleTheme()">
      <span class="material-icons">
        {{ isDarkMode ? "light_mode" : "dark_mode" }}
      </span>
    </button>
  </div>
</nav>
