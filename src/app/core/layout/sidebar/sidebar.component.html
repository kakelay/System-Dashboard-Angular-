<aside
  class="sidebar"
  [class.collapsed]="isCollapsed"
  [class.dark-mode]="isDarkMode"
>
  <!-- Header -->
  <div class="sidebar-header">
    <div class="logo">
      <img
        src="https://avatars.githubusercontent.com/u/110383694?v=4"
        class="logo-image"
        alt="Logo"
      />
      <span class="logo-text" *ngIf="!isCollapsed">BACK-OFFICE</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <ng-container *ngFor="let item of navItems">
      <button
        *ngIf="shouldShow(item)"
        (click)="onNavItemClick(item, $event)"
        [title]="item.label"
        class="nav-link"
        [class.active]="router.url === item.route"
        [ngClass]="item.class"
        type="button"
      >
        <span class="material-icons nav-icon">{{ item.icon }}</span>
        <span class="link-text" *ngIf="!isCollapsed">{{ item.label }}</span>
        <span class="active-indicator"></span>
      </button>
    </ng-container>
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer" *ngIf="!isCollapsed">
    <div class="user-profile">
      <img
        src="https://avatars.githubusercontent.com/u/110383694?v=4"
        class="user-avatar"
        alt="User Avatar"
      />
      <div class="user-info" *ngIf="user$ | async as user">
        <span class="user-name">{{ user.name }}</span>
        <span class="user-role">{{ user.role }}</span>
      </div>
    </div>

    <p class="footer-copy">© 2026 Enterprise UI</p>
  </div>
</aside>

<!-- Modern Logout Modal -->
<div
  *ngIf="showLogoutModal"
  class="logout-modal-overlay"
  (click)="onLogoutCancel()"
>
  <div class="logout-modal-dialog" (click)="$event.stopPropagation()">
    <!-- Close Button -->
    <button class="modal-close" (click)="onLogoutCancel()">✕</button>

    <!-- Modal Header -->
    <div class="modal-header">
      <div class="modal-icon">🚪</div>
      <h2>Logout Confirmation</h2>
    </div>

    <!-- Modal Body -->
    <div class="modal-body">
      <p class="modal-message">
        Are you sure you want to logout? You'll be redirected to the login page.
      </p>
      <div class="logout-info">
        <span class="info-icon">ℹ️</span>
        <span class="info-text">
          Your session will end and you'll need to login again to access the
          dashboard.
        </span>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="modal-footer">
      <button class="btn btn-outline" (click)="onLogoutCancel()">Cancel</button>
      <button class="btn btn-danger" (click)="onLogoutConfirm()">Logout</button>
    </div>
  </div>
</div>
