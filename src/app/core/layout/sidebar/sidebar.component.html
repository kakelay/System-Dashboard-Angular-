<aside
  class="sidebar"
  [class.collapsed]="isCollapsed"
  [class.dark-mode]="isDarkMode"
>
  <!-- Header -->
  <div class="sidebar-header">
    <div class="logo">
      <img
        src="https://avatars.githubusercontent.com/u/110383694?v=4"
        class="logo-image"
        alt="Logo"
      />
      <span class="logo-text" *ngIf="!isCollapsed">BACK-OFFICE</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <ng-container *ngFor="let item of navItems">
      <a
        *ngIf="shouldShow(item)"
        (click)="onNavItemClick(item)"
        [title]="item.label"
        class="nav-link"
        [class.active]="router.url === item.route"
        [ngClass]="item.class"
      >
        <span class="material-icons nav-icon">{{ item.icon }}</span>
        <span class="link-text" *ngIf="!isCollapsed">{{ item.label }}</span>
        <span class="active-indicator"></span>
      </a>
    </ng-container>
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer" *ngIf="!isCollapsed">
    <div class="user-profile">
      <img
        src="https://avatars.githubusercontent.com/u/110383694?v=4"
        class="user-avatar"
        alt="User Avatar"
      />
      <div class="user-info" *ngIf="user$ | async as user">
        <span class="user-name">{{ user.name }}</span>
        <span class="user-role">{{ user.role }}</span>
      </div>
    </div>

    <p class="footer-copy">© 2026 Enterprise UI</p>
  </div>
</aside>
