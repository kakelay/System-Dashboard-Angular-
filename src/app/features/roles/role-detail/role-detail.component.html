<div class="container">
  <div class="flex justify-between items-center mb-4">
    <h1>{{ roleData.name }} - Role Details</h1>
    <button class="btn btn-outline" (click)="cancel()">Back</button>
  </div>

  <div class="grid-2 gap-4">
    <!-- Role Information Section -->
    <div class="card">
      <h2 class="mb-4">Role Information</h2>
      <div class="form-group">
        <label class="form-label">Role Name</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="roleData.name"
          disabled
        />
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea
          class="form-control"
          [(ngModel)]="roleData.description"
          rows="4"
        ></textarea>
      </div>
    </div>

    <!-- Sub Role Admin Assignment Section -->
    <div class="card">
      <h2 class="mb-4">Sub Role Admin Assignment</h2>
      <p class="text-muted small mb-3">
        Assign sub-roles that can manage this role
      </p>

      <div *ngIf="!isAdmin" class="alert alert-warning mb-3">
        You don't have permission to assign sub-roles
      </div>

      <div class="sub-roles-list">
        <div
          *ngFor="let subRole of subRoles"
          class="sub-role-item flex items-center justify-between p-3 border rounded mb-2"
          [class.assigned]="subRole.assigned"
        >
          <label class="flex items-center cursor-pointer flex-1">
            <input
              type="checkbox"
              [checked]="subRole.assigned"
              (change)="toggleSubRoleAssignment(subRole)"
              [disabled]="!isAdmin"
              class="form-checkbox"
            />
            <span class="ml-3">{{ subRole.name }}</span>
          </label>
          <span *ngIf="subRole.assigned" class="badge badge-success text-xs"
            >Assigned</span
          >
        </div>
      </div>
    </div>
  </div>

  <!-- Permissions Section -->
  <div class="card mt-4">
    <h2 class="mb-4">Permissions</h2>

    <div class="permissions-grid">
      <div
        *ngFor="let permission of roleData.permissions"
        class="permission-item flex items-center p-3 border rounded mb-2"
      >
        <label class="flex items-center cursor-pointer flex-1">
          <input
            type="checkbox"
            [checked]="permission.granted"
            (change)="togglePermission(permission)"
            class="form-checkbox"
          />
          <span class="ml-3">{{ permission.name }}</span>
        </label>
        <span *ngIf="permission.granted" class="badge badge-success text-xs"
          >Granted</span
        >
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="flex justify-end gap-3 mt-6">
    <button class="btn btn-outline" (click)="cancel()">Cancel</button>
    <button class="btn btn-primary" (click)="saveChanges()">
      Save Changes
    </button>
  </div>
</div>
