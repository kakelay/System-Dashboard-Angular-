<div class="flex justify-between items-center mb-4">
  <div>
    <h1>User Management</h1>
    <p>Manage back-office users and their access levels.</p>
  </div>
  <button class="btn btn-primary" (click)="toggleForm()">
    {{ showForm ? 'Cancel' : 'Add New User' }}
  </button>
</div>

<!-- Add New User Form -->
<div *ngIf="showForm" class="card mb-4 p-4">
  <form [formGroup]="userForm" (ngSubmit)="addUser()">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block mb-1 font-medium">Full Name</label>
        <input type="text" formControlName="name" class="input" placeholder="Enter full name" />
      </div>
      <div>
        <label class="block mb-1 font-medium">Email</label>
        <input type="email" formControlName="email" class="input" placeholder="Enter email" />
      </div>
      <div>
        <label class="block mb-1 font-medium">Role</label>
        <select formControlName="role" class="input">
          <option value="ADMIN">ADMIN</option>
          <option value="MANAGER">MANAGER</option>
          <option value="USER">USER</option>
        </select>
      </div>
    </div>
    <div class="mt-4">
      <button type="submit" class="btn btn-success" [disabled]="userForm.invalid">
        Save User
      </button>
    </div>
  </form>
</div>

<!-- Users Table -->
<div class="card">
  <app-data-table [columns]="columns" [data]="users"></app-data-table>
</div>
