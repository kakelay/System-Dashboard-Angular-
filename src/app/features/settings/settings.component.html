<div class="header">
  <h1>Settings</h1>
</div>

<div class="card mt-4">
  <form [formGroup]="settingsForm" (ngSubmit)="save()">
    <div class="settings-section">
      <h3>General Configuration</h3>
      <div class="form-group mt-4">
        <label>Application Name</label>
        <input type="text" formControlName="appName" class="form-input" />
      </div>
      <div class="form-group">
        <label>Support Email</label>
        <input type="email" formControlName="supportEmail" class="form-input" />
      </div>
    </div>

    <div class="settings-section mt-4">
      <h3>Preferences</h3>
      <label class="flex items-center gap-2">
        <input type="checkbox" formControlName="enableNotifications" /> Enable
        Email Notifications
      </label>
    </div>

    <div class="mt-4 pt-4 border-top">
      <button type="submit" class="btn btn-primary">Save Changes</button>
    </div>
  </form>
</div>
