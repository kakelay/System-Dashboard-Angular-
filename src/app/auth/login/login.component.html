<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="image-container">
        <img src="https://avatars.githubusercontent.com/u/110383694?v=4" alt="Company Logo">
      </div>
      <h1>Back-Office Login</h1>
      <p>Enter your credentials to access the portal</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" formControlName="email" placeholder="name@company.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="••••••••">
      </div>

      <div class="error-msg" *ngIf="error">{{ error }}</div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="loading || loginForm.invalid">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="login-footer">
      <p>Demo Admin: admin@company.com / password</p>
      <p>Demo User: user@company.com / password</p>
    </div>
  </div>
</div>
